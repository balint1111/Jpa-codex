databaseChangeLog:
  - changeSet:
      id: 1
      author: codex
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(50)
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: username
                  type: VARCHAR(100)
              - column:
                  name: password
                  type: VARCHAR(100)
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: UUID
              - column:
                  name: role_id
                  type: BIGINT
  - changeSet:
      id: 2
      author: codex
      changes:
        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: "USER"
        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: "ADMIN"
