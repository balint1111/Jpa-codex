databaseChangeLog:
  - changeSet:
      id: 1
      author: codex
      changes:
        - createTable:
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: description
                  type: VARCHAR(200)
              - column:
                  name: completed
                  type: BOOLEAN
              - column:
                  name: user_id
                  type: UUID
